plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

group = project.group
version = "${minecraft_version}-${parcool_version}-${mod_version}"
base {
    archivesName = 'ParCool-CompatibilityAddon'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        client { client() }
        server { server() }
        data { data() }
    }

    mods {
        parcool_compat_addon {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // ParCool is mandatory for compiling this addon; using a local jar keeps this project buildable even
    // when upstream is not published to a Maven repo.
    compileOnly files("libs/${parcool_jar}")
    runtimeOnly files("libs/${parcool_jar}")

    // Optional compat mods (1.21.1 NeoForge) as local jars for a stable dev environment.
    compileOnly files("libs/${bettercombat_jar}")
    runtimeOnly files("libs/${bettercombat_jar}")

    compileOnly files("libs/${carryon_jar}")
    runtimeOnly files("libs/${carryon_jar}")

    compileOnly files("libs/${playeranimator_jar}")
    runtimeOnly files("libs/${playeranimator_jar}")

    // Better Combat requires Cloth Config at runtime.
    compileOnly files("libs/${clothconfig_jar}")
    runtimeOnly files("libs/${clothconfig_jar}")
}

processResources {
    def replaceProperties = [
            mod_id               : mod_id,
            mod_version          : mod_version,
            loader_version_range : loader_version_range,
            neo_version_range    : neo_version_range,
            minecraft_version    : minecraft_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"          : "ParCool Compatibility Addon",
                "Specification-Vendor"         : author,
                "Specification-Version"        : mod_version,
                "Implementation-Title"         : project.name,
                "Implementation-Version"       : mod_version,
                "Implementation-Vendor"        : author,
                "Implementation-Timestamp"     : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"                 : "parcool_compat_addon.mixins.json"
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}