pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Enables Gradle to auto-download the required Java toolchain (Java 21 for Minecraft 1.21.x)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url = 'https://www.cursemaven.com' }
        maven { url = 'https://api.modrinth.com/maven' }
    }
}

rootProject.name = "ParCool-CompatibilityAddon"

